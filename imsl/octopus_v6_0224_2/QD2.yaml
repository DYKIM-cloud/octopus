name: seabreeze2
channels:
  - pytorch
  - conda-forge
  - defaults

dependencies:
  # --- Python core ---
  - python=3.10.17
  - pip
  - setuptools
  - wheel

  # --- Numerical stack (numpy ABI 안정 구간) ---
  - numpy=1.26.4
  - scipy=1.11.*
  - pandas=2.0.*
  - numexpr
  - bottleneck
  - mkl
  - mkl-service
  - mkl_fft
  - mkl_random
  - intel-openmp

  # --- ML / stats ---
  - scikit-learn=1.3.*
  - statsmodels=0.14.*
  - lightgbm
  - shap
  - numba=0.57.*
  - llvmlite=0.40.*

  # --- Optimization / causality ---
  - cvxpy
  - osqp
  - scs
  - econml
  - dowhy
  - causal-learn

  # --- Plotting / UI ---
  - matplotlib
  - seaborn
  - pillow
  - pyqt=6
  - qt-main

  # --- PyTorch (CPU 기준, 안정) ---
  - pytorch=2.1.*
  - pytorch-mutex=1.0=cpu

  # --- IO / misc ---
  - h5py
  - networkx
  - joblib
  - tqdm
  - pyyaml
  - rich
  - xlsxwriter
  - graphviz

  # --- MPI (필요 시) ---
  - mpi
  - mpi4py

  # --- pip-only 영역 ---
  - pip:
      - tensorflow==2.13.*      # Python 3.10 마지막 안정 LTS
      - tensorboard
      - tensorboard-data-server
      - gpytorch
      - linear-operator
      - jaxtyping
      - seabreeze
      - opcua
      - olymp==0.0.1b0
      - paramiko
      - prettytable
      - lxml
